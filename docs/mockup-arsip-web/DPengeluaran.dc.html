          </label>
          <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: {{t.ink2}}">{{L.date}}</span><span style="font-weight: 700">{{L.today}}</span></div>
          <button style="height: 44px; border-radius: 12px; border: 1.5px dashed {{t.field}}; background: transparent; color: {{t.ink2}}; font-size: 14px; font-weight: 600">{{L.photo}}</button>

        </section>
      </div>
    </div>
  </main>
</div>

    const keys = ['elec', 'water', 'wifi', 'clean', 'repair', 'other'];
    const th = (right) => 'text-align:' + (right ? 'right' : 'left') + ';padding:10px 8px;font-size:12px;font-weight:700;color:' + t.ink2 + ';text-transform:uppercase;letter-spacing:0.04em;';
    const amountNum = parseInt(String(s.amount).replace(/\D/g, ''), 10) || 0;
    const can = amountNum > 0;
    return Object.assign(sh, {
      L: L,
      totalText: rp(all.reduce((a, e) => a + e[2], 0)),
      filters: [{ k: 'all', label: tr('Semua', 'All') }].concat(keys.map((k) => ({ k: k, label: C[k][0] }))).map((f) => ({ label: f.label, style: pill(s.filter === f.k), pick: () => this.setState({ filter: f.k }) })),
      cols: [[tr('Tanggal', 'Date')], [tr('Kategori', 'Category')], [tr('Keterangan', 'Description')], [tr('Nota', 'Receipt')], [tr('Nominal', 'Amount'), 1]].map((c) => ({ label: c[0], style: th(c[1]) })),
      rows: list.map((e) => ({ date: e[0], cat: C[e[1]][0], d: C[e[1]][1], text: rp(e[2]), note: e[3], nota: e[4] ? tr('Ada', 'Attached') : '—',
        iconStyle: 'flex:none;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:' + C[e[1]][2] + ';color:' + C[e[1]][3] + ';' })),
      empty: list.length === 0,
      formCats: keys.map((k) => ({ label: C[k][0], style: pill(s.formCat === k, 34), pick: () => this.setState({ formCat: k }) })),
      amount: s.amount, note: s.note,
      setAmount: (e) => { const n = parseInt(e.target.value.replace(/\D/g, ''), 10); this.setState({ amount: n ? rp(n) : '' }); },
      setNote: (e) => this.setState({ note: e.target.value }),
      cannotSave: !can,
      saveStyle: 'height:48px;border-radius:12px;border:0;font-size:15px;font-weight:700;color:#FFFFFF;background:' + t.accent + ';opacity:' + (can ? '1' : '0.45') + ';cursor:' + (can ? 'pointer' : 'not-allowed') + ';',
      save: () => { if (!can) return; this.setState({ added: [['15 Nov', s.formCat, amountNum, s.note || C[s.formCat][0], false]].concat(s.added), amount: '', note: '', filter: 'all' }); }
    });
  }
}
</script>
